name: Quarto Publish

on:
  push:
    branches: [main]

# HUOM: yksi job, YKSI steps-lohko, ei kahta. Tämä oli "invalid workflow file"
# -virheen syy.
jobs:
  build-deploy:
    runs-on: ubuntu-24.04            # GDAL 3.8 -> ei terra/GDAL-törmäystä

    permissions:
      contents: read
      pages: write
      id-token: write

    env:
      R_LIBS_USER: ~/.local/share/R
      GFW_TOKEN: ${{ secrets.GFW_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true      # Posit PPM -> valmiit Linux-binäärit

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true              # voit poistaa, jos et renderöi PDF:iä

      # Ajonaikaiset järjestelmäkirjastot. 24.04:ssä libgdal-dev = GDAL 3.8,
      # joten myös mahdollinen lähdekäännös onnistuisi — mutta binäärit ovat
      # nopeammat.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gfortran cmake make \
            libcurl4-openssl-dev libssl-dev libxml2-dev \
            libharfbuzz-dev libfribidi-dev \
            libfontconfig1-dev libfreetype6-dev \
            libpng-dev libtiff5-dev libjpeg-dev \
            libgdal-dev libgeos-dev libproj-dev libudunits2-dev

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/R
            ~/.cache/R
          key: r-${{ runner.os }}-2404-4.5.1-${{ hashFiles('**/*.qmd', '**/*.R') }}
          restore-keys: |
            r-${{ runner.os }}-2404-4.5.1-

      - name: Install R packages
        shell: Rscript {0}
        run: |
          lib <- Sys.getenv("R_LIBS_USER")
          dir.create(lib, recursive = TRUE, showWarnings = FALSE)
          .libPaths(c(lib, .libPaths()))
          # Binäärirepo Ubuntu 24.04:lle (noble). TÄMÄ on ratkaiseva rivi:
          # ilman sitä paketit käännetään lähteestä ja terra kaatuu GDAL:iin.
          options(repos = c(CRAN = "https://p3m.dev/cran/__linux__/noble/latest"))
          install.packages("pak", lib = lib)
          pak::pak(c(
            "eurostat", "corrplot", "dplyr", "tsibble", "ggplot2", "lubridate",
            "feasts", "bcp", "fable", "slider", "flextable", "tidyverse",
            "dcurves", "scoringRules", "here", "wbstats", "strucchange",
            "countrycode", "janitor", "ggalluvial", "ggraph", "igraph",
            "ggtext", "quantreg", "tidybayes", "tidygraph", "broom", "spdep",
            "data.table", "glue", "pxweb", "readxl", "knitr", "mixtools",
            "future", "furrr", "fst", "qs2", "ecmwfr", "sf", "survminer",
            "terra", "rnaturalearth", "rnaturalearthdata", "stringr",
            "patchwork", "acledR", "modelsummary", "rstanarm", "zoo",
            "treemapify", "brms", "rstatix", "stan-dev/cmdstanr", "remotes",
            "GlobalFishingWatch/gfwr"
          ))

      - name: Debug R libraries
        shell: Rscript {0}
        run: |
          cat("R version:", R.version.string, "\n")
          cat(".libPaths():\n"); print(.libPaths())
          cat("Asennettuja paketteja:", nrow(installed.packages()), "\n")
          # Varmistus, että raskaat geo/bayes-paketit latautuvat
          for (p in c("terra", "sf", "brms", "rstanarm")) {
            ok <- requireNamespace(p, quietly = TRUE)
            cat(sprintf("  %-10s %s\n", p, if (ok) "OK" else "PUUTTUU"))
          }

      - name: Render site
        run: quarto render --no-cache

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4