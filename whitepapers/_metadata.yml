lang: en
format:
  html:
    toc: true
    toc-depth: 3
    code-fold: true
    code-tools: true
    theme: cosmo
    css: kristian-theme.css
  pdf:
    documentclass: article
    papersize: a4
    fontsize: 11pt
    geometry:
      - margin=2.5cm
    toc: true
    toc-depth: 3
    colorlinks: true
    code-overflow: wrap
    pdf-engine: xelatex
    mainfont: "TeX Gyre Termes"      # Times-tyylinen, aina saatavilla
    sansfont: "TeX Gyre Heros"       # Helvetica-tyylinen
    monofont: "TeX Gyre Cursor"      # monospace
author: "Kristian Vepsäläinen"
date-format: "D MMMM YYYY"
title-block-banner: true
freeze: true
